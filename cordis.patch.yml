# dsh-wallpaper-engine bundle patch
#
# This file is the `dsh.bundle.patch` layer of the plugin package: when the
# plugin is installed through the official CLI
#   dsh plugin --profile web add @marlonlau/dsh-wallpaper-engine
# the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `@marlonlau/dsh-wallpaper-engine` to
# the bundle stack. The profile boot then merges this patch (a single
# `insert` of the plugin row) exactly like a manual cordis.patch.yml mount
# line.
- insert:
    - id: wallpaper-engine
      name: '@marlonlau/dsh-wallpaper-engine'
